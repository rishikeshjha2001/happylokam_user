name: iOS Build and Prebuild

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Compress iOS Project
        run: zip -r ios-project.zip ios/

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: happylokam-user-ios-project
          path: ios-project.zip
          retention-days: 14
